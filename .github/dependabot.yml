version: 2
updates:
  - package-ecosystem: "github-actions"
    directories: ["/"]
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  - package-ecosystem: "npm"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    # A dependency joins the first group it matches; `-other` takes what has no SemVer level.
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]
      npm-other:
        patterns: ["*"]
    cooldown:
      default-days: 7
      semver-major-days: 14
